title: Saivam - Ancient Tamil & Other Spiritual Texts
description: Classical Tamil poems and spiritual teachings
remote_theme: pages-themes/cayman@v0.2.0
markdown: kramdown
permalink: /:basename/

# Include files that should be processed
include:
  - license.md

# Exclude files from watch to prevent infinite rebuild loops
exclude:
  - VERSION
  - gitcommit.sh
  - gitstatus.sh
  - .git
  - .gitignore
  - node_modules
  - package.json
  - package-lock.json
  - .DS_Store
  - .claude/
  - scripts/
  - requirements.txt
  - Dockerfile
  - podman-compose.yml
  - tasks/
  - docs/
  - tests/
  - "*.test.js"
  - "*.test.cjs"
  - "*.spec.js"
  - .playwright/
  - playwright-report/
  - test-results/
  - CLAUDE.md
  - WORKFLOW_VERIFICATION.md
  - WORKFLOW_IMPLEMENTATION_SUMMARY.md
  - README-scripts.md
  

# Ensure markdown files are served as pages
future: false

# Apply default layout to all .md files
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
