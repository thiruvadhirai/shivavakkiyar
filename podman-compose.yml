# Docker Compose Specification v1.0 (Compose File Format)
# Reference: https://docs.docker.com/reference/compose-file/
# Validated against: Compose v2.20+, Podman 4.0+

services:
  # Development Server - Jekyll Static Site Generator
  saivamcloud-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: saivamcloud-dev:latest
    container_name: saivamcloud-dev

    description: "Jekyll development server for Panchanga Calculator site"

    ports:
      - "5080:4000"

    volumes:
      - type: bind
        source: .
        target: /srv/jekyll
        bind:
          propagation: rprivate

    environment:
      JEKYLL_ENV: development

    working_dir: /srv/jekyll

    networks:
      test-network: null

    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 3

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Test Container - E2E Browser Testing
  saivamcloud-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: saivamcloud-test:latest
    container_name: saivamcloud-test

    description: "Playwright E2E testing container (isolated, no host bloat)"

    depends_on:
      saivamcloud-dev:
        condition: service_healthy

    environment:
      TEST_URL: http://saivamcloud-dev:4000
      HEADLESS: "true"

    volumes:
      - type: bind
        source: .
        target: /app
        bind:
          propagation: rprivate

    networks:
      test-network: null

    profiles:
      - test

    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 1

networks:
  test-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
