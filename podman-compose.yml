# Docker Compose Specification v1.0 (Compose File Format)
# Reference: https://docs.docker.com/reference/compose-file/
# Validated against: Compose v2.20+, Podman 4.0+

services:
  # Development Server - Jekyll Static Site Generator
  saivamcloud-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: saivamcloud-dev:latest
    container_name: saivamcloud-dev

    description: "Jekyll development server for Panchanga Calculator site"

    ports:
      - "5080:4000"

    volumes:
      - type: bind
        source: .
        target: /srv/jekyll
        bind:
          propagation: rprivate

    environment:
      JEKYLL_ENV: development

    working_dir: /srv/jekyll

    networks:
      test-network: null

    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 3

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/panchangam/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Test Container - E2E Browser Testing
  # Mounts source for fast testing without rebuilds
  # Only starts with: podman-compose --profile test up
  saivamcloud-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: saivamcloud-test:latest
    container_name: saivamcloud-test

    description: "Playwright E2E testing container (source-mounted for fast iteration)"

    depends_on:
      saivamcloud-dev:
        condition: service_healthy

    environment:
      TEST_URL: http://saivamcloud-dev:4000
      HEADLESS: "true"

    volumes:
      - type: bind
        source: .
        target: /app
        bind:
          propagation: rprivate

    networks:
      test-network: null

    profiles:
      - test

    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 1

    # Run tests from container with: podman-compose --profile test run --rm saivamcloud-test ./tests/run-<type>.sh
    # Examples:
    #   ./tests/run-all.sh         - Run unit + integration + E2E
    #   ./tests/run-unit.sh        - Run unit tests only
    #   ./tests/run-integration.sh - Run integration tests only
    #   ./tests/run-e2e.sh         - Run E2E tests only

networks:
  test-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
    # Removed explicit subnet to avoid conflicts with other projects
    # Podman will auto-assign unique subnet per project
    # DNS resolution (saivamcloud-dev:4000) still works perfectly
