<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>

  <!-- Cayman theme stylesheet (local copy) -->
  <link rel="stylesheet" href="{{ '/assets/css/cayman-theme.css' | relative_url }}">

  <!-- Custom CSS for burger menu and overrides -->
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

  <!-- Panchanga Calculator CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/panchanga.css' | relative_url }}">

  <style>
    /* Accessibility: Skip to main content link */
    .skip-to-main {
      position: absolute;
      top: -40px;
      left: 0;
      background: #0366d6;
      color: white;
      padding: 8px;
      text-decoration: none;
      z-index: 100;
    }

    .skip-to-main:focus {
      top: 0;
    }

    /* Burger Menu & Sidebar */
    body {
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #f6f8fa;
      border-bottom: 1px solid #e1e4e8;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .burger-btn {
      background: none;
      border: 2px solid transparent;
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
      color: #24292e;
      line-height: 1;
      border-radius: 4px;
      transition: border-color 0.2s;
    }

    .burger-btn:hover,
    .burger-btn:focus {
      color: #0366d6;
      border-color: #0366d6;
      outline: none;
    }

    .burger-btn:focus-visible {
      outline: 2px solid #0366d6;
      outline-offset: 2px;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #24292e;
    }

    /* Sidebar Navigation */
    .nav-sidebar {
      position: fixed;
      left: -280px;
      top: 0;
      width: 280px;
      height: 100vh;
      background-color: #fff;
      border-right: 1px solid #e1e4e8;
      z-index: 999;
      transition: left 0.3s ease-in-out;
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
    }

    .nav-sidebar.open {
      left: 0;
    }

    .nav-close {
      background: none;
      border: 2px solid transparent;
      font-size: 28px;
      cursor: pointer;
      padding: 12px 16px;
      color: #24292e;
      line-height: 1;
      width: 100%;
      text-align: right;
      border-radius: 4px;
      transition: border-color 0.2s;
    }

    .nav-close:hover,
    .nav-close:focus {
      color: #0366d6;
      border-color: #0366d6;
      outline: none;
    }

    .nav-close:focus-visible {
      outline: 2px solid #0366d6;
      outline-offset: -4px;
    }

    .nav-sidebar nav {
      padding: 16px 0;
    }

    .nav-sidebar a {
      display: block;
      padding: 12px 16px;
      color: #0366d6;
      text-decoration: none;
      border-left: 3px solid transparent;
      transition: background-color 0.2s, border-left-color 0.2s;
    }

    .nav-sidebar a:hover,
    .nav-sidebar a:focus {
      background-color: #f6f8fa;
      border-left-color: #0366d6;
      outline: none;
    }

    .nav-sidebar a:focus-visible {
      outline: 2px solid #0366d6;
      outline-offset: -2px;
    }

    /* Overlay */
    .nav-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 998;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-in-out;
    }

    .nav-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Main content adjustments */
    main {
      margin-top: 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header h1 {
        font-size: 16px;
      }

      .nav-sidebar {
        width: 250px;
        left: -250px;
      }
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      .nav-sidebar,
      .nav-overlay {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- Accessibility: Skip to main content link -->
  <a href="#main-content" class="skip-to-main">Skip to main content</a>

  <!-- Header with Burger Menu -->
  <header role="banner">
    <button class="burger-btn" id="burger-btn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-sidebar">☰</button>
    <h1>{{ site.title | default: 'Home' }}</h1>
  </header>

  <!-- Sidebar Navigation -->
  <nav class="nav-sidebar" id="nav-sidebar" aria-label="Main navigation">
    <button class="nav-close" id="nav-close" aria-label="Close navigation menu">×</button>
    <nav>
      {% for item in site.data.nav %}
        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endfor %}
    </nav>
  </nav>

  <!-- Overlay -->
  <div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>

  <!-- Main content area -->
  <main class="page-content" id="main-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo">
    <span class="site-footer-credits">
      <a href="{{ '/license' | relative_url }}">Licensed under Creative Commons (CC0)</a>
    </span>
  </footer>

  <script>
    const burgerBtn = document.getElementById('burger-btn');
    const navClose = document.getElementById('nav-close');
    const navSidebar = document.getElementById('nav-sidebar');
    const navOverlay = document.getElementById('nav-overlay');
    let isNavOpen = false;

    function openNav() {
      navSidebar.classList.add('open');
      navOverlay.classList.add('open');
      isNavOpen = true;
      burgerBtn.setAttribute('aria-expanded', 'true');
      // Move focus to close button
      navClose.focus();
    }

    function closeNav() {
      navSidebar.classList.remove('open');
      navOverlay.classList.remove('open');
      isNavOpen = false;
      burgerBtn.setAttribute('aria-expanded', 'false');
      // Return focus to burger button
      burgerBtn.focus();
    }

    burgerBtn.addEventListener('click', () => {
      isNavOpen ? closeNav() : openNav();
    });

    navClose.addEventListener('click', closeNav);
    navOverlay.addEventListener('click', closeNav);

    // Close sidebar when a link is clicked
    document.querySelectorAll('.nav-sidebar a').forEach(link => {
      link.addEventListener('click', closeNav);
    });

    // Keyboard accessibility: ESC to close, Tab management
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isNavOpen) {
        closeNav();
      }
    });

    // Trap focus within sidebar when open
    document.addEventListener('keydown', (e) => {
      if (!isNavOpen || e.key !== 'Tab') return;

      const focusableElements = navSidebar.querySelectorAll('button, a');
      const firstElement = focusableElements[0];
      const lastElement = focusableElements[focusableElements.length - 1];

      if (e.shiftKey && document.activeElement === firstElement) {
        e.preventDefault();
        lastElement.focus();
      } else if (!e.shiftKey && document.activeElement === lastElement) {
        e.preventDefault();
        firstElement.focus();
      }
    });
  </script>

  <!-- Astronomy Engine - NASA JPL Ephemeris (local copy) -->
  <script src="{{ '/assets/js/astronomy.browser.js' | relative_url }}" defer></script>

  <!-- Astronomy Engine - Fallback CDN if primary fails -->
  <script>
    // Try alternative CDN if primary fails
    window.addEventListener('DOMContentLoaded', function() {
      if (typeof Astronomy === 'undefined') {
        console.log('Primary CDN loading, retrying...');
        // Give it 2 more seconds then try alternative
        setTimeout(function() {
          if (typeof Astronomy === 'undefined') {
            console.error('Astronomy Engine: Failed to load local library.');

            // Show warning message
            var warningDiv = document.createElement('div');
            warningDiv.style.cssText = 'background:#fff5f5; border:2px solid #d73a49; padding:15px; margin:15px; border-radius:4px; color:#d73a49; font-family:monospace; font-size:13px;';
            warningDiv.innerHTML = '<strong>⚠️ Astronomy Engine Load Error</strong><br><br>' +
              'The Astronomy Engine library failed to load.<br><br>' +
              '<strong>Troubleshooting:</strong><br>' +
              '• Check browser console (F12 → Console) for detailed errors<br>' +
              '• Verify /assets/js/astronomy.browser.js is accessible<br>' +
              '• Try refreshing the page (Ctrl+R)<br><br>' +
              'The calculator requires this library to function.';

            var containers = document.querySelectorAll('[id*="panchanga"]');
            if (containers.length > 0) {
              containers[0].parentNode.insertBefore(warningDiv, containers[0]);
            } else {
              document.body.insertBefore(warningDiv, document.body.firstChild);
            }
          }
        }, 2000);
      }
    });
  </script>

  <!-- Panchanga Calculator Scripts (defer for proper loading order) -->
  <script src="{{ '/assets/js/location-manager.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/noaa-calculator.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/panchangam-languages.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/panchanga-calculator.js' | relative_url }}" defer></script>

  <!-- Version Footer -->
  <footer style="margin-top: 40px; padding: 20px; border-top: 1px solid #e1e4e8; text-align: center; font-size: 12px; color: #666;">
    <div>Panchanga Calculator v{{ site.data.version.version }} • Updated: {{ site.data.version.date }}</div>
  </footer>

</body>
</html>
