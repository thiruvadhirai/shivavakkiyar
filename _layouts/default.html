<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

  <style>
    /* Burger Menu & Sidebar */
    body {
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #f6f8fa;
      border-bottom: 1px solid #e1e4e8;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .burger-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      color: #24292e;
      line-height: 1;
    }

    .burger-btn:hover {
      color: #0366d6;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #24292e;
    }

    /* Sidebar Navigation */
    .nav-sidebar {
      position: fixed;
      left: -280px;
      top: 0;
      width: 280px;
      height: 100vh;
      background-color: #fff;
      border-right: 1px solid #e1e4e8;
      z-index: 999;
      transition: left 0.3s ease-in-out;
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
    }

    .nav-sidebar.open {
      left: 0;
    }

    .nav-close {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      padding: 12px 16px;
      color: #24292e;
      line-height: 1;
      width: 100%;
      text-align: right;
    }

    .nav-close:hover {
      color: #0366d6;
    }

    .nav-sidebar nav {
      padding: 16px 0;
    }

    .nav-sidebar a {
      display: block;
      padding: 12px 16px;
      color: #0366d6;
      text-decoration: none;
      border-left: 3px solid transparent;
      transition: background-color 0.2s, border-left-color 0.2s;
    }

    .nav-sidebar a:hover {
      background-color: #f6f8fa;
      border-left-color: #0366d6;
    }

    /* Overlay */
    .nav-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 998;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-in-out;
    }

    .nav-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Main content */
    main {
      margin-top: 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header h1 {
        font-size: 16px;
      }

      .nav-sidebar {
        width: 250px;
        left: -250px;
      }
    }
  </style>
</head>

<body>

  <!-- Header with Burger Menu -->
  <header>
    <button class="burger-btn" id="burger-btn" aria-label="Toggle navigation">☰</button>
    <h1>{{ site.title | default: 'Home' }}</h1>
  </header>

  <!-- Sidebar Navigation -->
  <nav class="nav-sidebar" id="nav-sidebar">
    <button class="nav-close" id="nav-close" aria-label="Close navigation">×</button>
    <nav>
      {% for item in site.data.nav %}
        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endfor %}
    </nav>
  </nav>

  <!-- Overlay -->
  <div class="nav-overlay" id="nav-overlay"></div>

  <!-- Main content area using Primer-like classes -->
  <main class="container-lg px-3 my-5 markdown-body" aria-label="Content">
    <div class="wrapper">

      <!-- Custom heading driven by front matter -->
      <h1 class="custom-heading">
        {{ page.custom_heading | default: page.title }}
      </h1>

      {{ content }}
    </div>
  </main>

  <!-- Simple footer (self-contained, no includes) -->
  <footer class="px-3 py-3 border-top">
    <div class="container-lg">
      <p class="text-small text-gray">
        <a href="{{ '/license' | relative_url }}">Ancient Religious Texts licensed under Creative Commons (CC0)</a>
      </p>
    </div>
  </footer>

  <script>
    const burgerBtn = document.getElementById('burger-btn');
    const navClose = document.getElementById('nav-close');
    const navSidebar = document.getElementById('nav-sidebar');
    const navOverlay = document.getElementById('nav-overlay');

    burgerBtn.addEventListener('click', () => {
      navSidebar.classList.add('open');
      navOverlay.classList.add('open');
    });

    navClose.addEventListener('click', () => {
      navSidebar.classList.remove('open');
      navOverlay.classList.remove('open');
    });

    navOverlay.addEventListener('click', () => {
      navSidebar.classList.remove('open');
      navOverlay.classList.remove('open');
    });

    // Close sidebar when a link is clicked
    document.querySelectorAll('.nav-sidebar a').forEach(link => {
      link.addEventListener('click', () => {
        navSidebar.classList.remove('open');
        navOverlay.classList.remove('open');
      });
    });
  </script>

</body>
</html>
